name: Execute npm commands
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests and generate coverage reports
        run: npm run test-coverage

      - name: Build
        run: npm run build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.node-version == '20.x'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    needs: build

    # Never from a pull request: this job can publish, and without this a PR
    # that bumps the version would publish it before anyone reviewed it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # npm trusts this workflow in this repository (trusted publishing), and
    # GitHub proves which workflow is asking with a short-lived OIDC token.
    # There is no npm token to leak, expire or rotate.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # A push that does not bump the version has nothing to publish. Without
      # this, every such push would fail the job and leave main red.
      - name: Check whether this version is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.exists == 'false'
        run: npm install

      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public
